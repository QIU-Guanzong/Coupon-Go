name: Manual functional tests

# Explicitly started by a maintainer; this workflow is not a merge gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API and guest gateways
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r apps/api/requirements.lock
      - name: Install CJK font used by contract PDF tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-wqy-zenhei
      - name: API reconciliation and isolation tests (SQLite)
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/coupon-go-manual-test.sqlite
          FIX3_FORCE_SQLITE: '1'
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_db_isolation.py
          tests/test_dianping_unify.py
          tests/test_fix3_row_locks.py
          tests/test_settlement_paid_refund_e2e.py
      - name: Merchant contract font regression
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/coupon-go-manual-test.sqlite
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_dianping_merchant_mgmt.py::test_approve_application_creates_shop_and_notifies
          tests/test_dianping_merchant_mgmt.py::test_second_approved_application_creates_second_shop
          tests/test_dianping_merchant_mgmt.py::test_patch_pending_application
          tests/test_dianping_merchant_mgmt.py::test_signed_contract_keeps_application_shop_name
      - name: Stripe test-mode payment regressions (simulated)
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/coupon-go-manual-test.sqlite
        run: python -m pytest -q -p no:cacheprovider tests/test_stripe_web_checkout.py
      - name: Read-only public preview tests
        run: python infra/public-preview/test_public_api.py
      - name: Interactive trial tests
        run: python -m pytest -q -p no:cacheprovider infra/interactive-trial/test_trial_api.py

  mobile:
    name: Flutter analysis and mode tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Unpack tracked assets
        run: python3 tools/unpack_assets.py
      - name: Install locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Normal mode selected tests
        run: flutter test --no-pub test/guest_journeys_test.dart test/preview_copy_test.dart test/qbot_offers_test.dart test/subpages_d5_test.dart test/app_config_integration_test.dart test/scan_branch_choice_test.dart test/package_payment_test.dart test/vendor_stale_requests_test.dart
      - name: Read-only preview mode selected tests
        run: flutter test --no-pub --dart-define=PUBLIC_DEMO=true test/guest_journeys_test.dart test/preview_copy_test.dart test/qbot_offers_test.dart test/subpages_d5_test.dart test/app_config_integration_test.dart test/scan_branch_choice_test.dart test/package_payment_test.dart test/vendor_stale_requests_test.dart
      - name: Interactive trial mode selected tests
        run: flutter test --no-pub --dart-define=PUBLIC_TRIAL=true test/guest_journeys_test.dart test/preview_copy_test.dart test/qbot_offers_test.dart test/subpages_d5_test.dart test/app_config_integration_test.dart test/scan_branch_choice_test.dart test/package_payment_test.dart test/vendor_stale_requests_test.dart
