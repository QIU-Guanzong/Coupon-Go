<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="查找優惠券、管理 Q Wallet，或進入商家服務核銷優惠券。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Coupon GO!">
  <link rel="apple-touch-icon" href="assets/assets/images/img_logo_cropped.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/assets/images/img_logo_cropped.png"/>

  <link rel="preload" href="main.dart.js" as="script">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    #launch { position: fixed; inset: 0; display: grid; place-content: center;
      margin: 0; background: #f5f5f6; color: #ce2e39; text-align: center;
      font: italic 800 32px/1.2 system-ui, sans-serif; letter-spacing: -1px; }
    #launch small, #launch a { font: 15px/1.6 system-ui, sans-serif;
      color: #353535; letter-spacing: normal; }
  </style>
  <title>Coupon GO!</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="launch" role="status">Coupon GO!
    <noscript><small>請啟用 JavaScript 以開啟網頁版。</small></noscript>
  </div>
  <script>
    const launch = document.getElementById('launch');
    window.addEventListener('flutter-first-frame', () => launch.remove(), {once: true});
    window.addEventListener('error', event => {
      if (event.target instanceof HTMLScriptElement && launch.isConnected &&
          !launch.querySelector('a')) {
        const retry = document.createElement('a');
        retry.href = location.href;
        retry.textContent = '未能載入，重新整理';
        launch.append(retry);
      }
    }, true);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
